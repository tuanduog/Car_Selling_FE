<div class="container py-4" style="margin-top: 80px; max-width: 1000px;">
    <div class="d-flex justify-content-between">
        <h4 class="mb-4 fw-bold d-flex align-items-center gap-2">
            <i class="bi bi-bag-check text-primary fs-4"></i>
            Đơn hàng của tôi
        </h4>
    </div>

    <div id="order-list">
        <!-- render data -->
    </div>
</div>

<div class="modal fade" id="paymentDetailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Chi tiết đơn hàng</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body" id="paymentDetailBody">
        <div class="text-center">
          <div class="spinner-border text-primary"></div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
        <button class="btn btn-primary d-none" id="payBtn">Thanh toán</button>
      </div>
    </div>
  </div>
</div>

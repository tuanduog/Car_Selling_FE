        <div class="row mb-3">
            <div class="col-6">

                <label for="inputAddress" class="form-label">Dòng xe</label>
                <input type="text" class="form-control" id="inputVehicleModel" value="VF9">
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-6">
                <label for="inputEmail4" class="form-label">Tên phụ kiện</label>
                <input type="text" class="form-control" id="inputAccessoryName" value="Tấm che pin cao áp">
            </div>
             <div class="col-6">
                <label for="inputAddress" class="form-label">Tồn kho</label>
                <input type="text" class="form-control" id="inputStock" value="500">
            </div>
        </div>
        <div class="row">
            <div class="col-6">
                <label for="inputAddress" class="form-label">Giá nhập</label>
                <input type="text" class="form-control" id="inputPriceIn" value="8000000đ">
            </div>
            <div class="col-6">
                <label for="inputAddress" class="form-label">Giá bán</label>
                <input type="text" class="form-control" id="inputPriceOut" value="8998000đ">
            </div>
        </div>
        <div class="col-12">
            <label for="inputAddress" class="form-label">Hình ảnh</label>
            <div class="img-container">
                <img src="https://shop.vinfastauto.com/on/demandware.static/-/Sites-vinfast_vn_master/default/dwca9bd466/images/Accessory/EEP80001000/1.png" class="img-fluid" alt="Tấm che pin cao áp" style="max-width: 100px; height: auto;">
                <img src="https://shop.vinfastauto.com/on/demandware.static/-/Sites-vinfast_vn_master/default/dwca9bd466/images/Accessory/EEP80001000/1.png" class="img-fluid" alt="Tấm che pin cao áp" style="max-width: 100px; height: auto;">
                <img src="https://shop.vinfastauto.com/on/demandware.static/-/Sites-vinfast_vn_master/default/dwca9bd466/images/Accessory/EEP80001000/1.png" class="img-fluid" alt="Tấm che pin cao áp" style="max-width: 100px; height: auto;">
            </div>
            <input type="file" class="form-control" id="inputImage">
        </div>
        <div class="col-12">
            <label for="inputAddress" class="form-label">Mô tả sản phẩm</label>
            <textarea rows="5" class="form-control" name="inputDescription" id="inputDescription">Tấm che pin VinFast là phụ kiện thiết yếu giúp bảo vệ hệ thống pin xe điện khỏi tác động bên ngoài, đảm bảo hiệu suất và tuổi thọ pin trong suốt quá trình sử dụng. Với thiết kế chuyên biệt cho từng dòng xe VinFast, sản phẩm mang đến độ bền cao, khả năng chịu va đập và chống chịu môi trường khắc nghiệt, giúp người dùng yên tâm vận hành xe.</textarea>
        </div>
        <div class="col-12">
            <label for="inputAddress" class="form-label">Thông tin chi tiết</label>
            <textarea rows="10" class="form-control" name="inputInfo" id="inputInfo">TẤM CHE PIN VINFAST – BẢO VỆ PIN TỐI ƯU, ĐỘ BỀN CAO

1. Thiết kế và vật liệu
Tấm che pin VinFast được thiết kế vừa vặn với các dòng xe VinFast, đảm bảo độ ổn định và an toàn trong quá trình vận hành. Sản phẩm có ngoại quan sơn đen nhám, mang đến vẻ ngoài hiện đại và đồng bộ với khung gầm xe.

Vật liệu, màu sắc: Theo sơn đen nhám.
Kích thước & trọng lượng: Thiết kế chuyên biệt theo từng dòng xe, phù hợp với tiêu chuẩn kỹ thuật của VinFast:
VF 9: 2495,7 x1634x7,4mm | 42,5 ± 2 kg.
Độ dày: 1,0mm.

2. Tính năng vượt trội
Chịu va đập cao: Độ bền cao, bảo vệ pin khỏi các tác động cực đoan từ bên ngoài.
Chống chịu môi trường: Chống chịu nhiệt độ độ ẩm cao, chống ăn mòn từ muối, ẩm và hóa chất như dầu mỡ, độ bền lớp sơn chống chịu môi trường muối khắc nghiệt.
Không ảnh hưởng đến rung, ồn: Đảm bảo xe vận hành êm ái, không làm gia tăng độ rung hay tiếng ồn.
Dễ vệ sinh: Thiết kế bề mặt có lỗ thoát nước giúp dễ dàng lau chùi, chống bám bẩn.

3. Đảm bảo an toàn & bảo hành
Kiểm định chất lượng: Được VinFast kiểm định về chất lượng an toàn bảo vệ pin và không ảnh hưởng tới tính năng của xe.
Chính sách bảo hành: Không ảnh hưởng đến chính sách bảo hành của gói pin nếu được lắp đặt tại các đơn vị ủy quyền VinFast.</textarea>

<main id="main" class="main">

  <div class="pagetitle">
    <h1>Thêm người dùng</h1>
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
        <li class="breadcrumb-item active">Thêm sự kiện</li>
      </ol>
    </nav>
  </div><!-- End Page Title -->
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Thông tin sự kiện</h5>

      <!-- Vertical Form -->
      <form class="row g-3">
        <div class="col-12">
          <label for="inputName" class="form-label">Tên sự kiện</label>
          <input type="text" class="form-control" id="inputName">
        </div>
        <div class="col-12">
          <label for="inputImage" class="form-label">Thêm hình ảnh</label>
          <input type="file" class="form-control" id="inputImage">
        </div>
        <div class="col-12">
            <label for="eventType" class="form-label">Loại sự kiện</label>
            <select id="eventType" class="form-select">
                <option>Khai trương</option>
                <option>Khuyến mãi</option>
                <option>...</option>
            </select>
        </div>
        <div class="col-12">
          <label for="inputEvent" class="form-label">Mô tả sự kiện</label>
          <textarea rows="5" class="form-control" id="inputEvent"></textarea>
        </div>
        <div class="col-12">
          <label for="dateStart" class="form-label">Ngày diễn ra</label>
          <input type="date" class="form-control" id="dateStart">
        </div>
        <div class="col-12">
          <label for="dateEnd" class="form-label">Ngày kết thúc</label>
          <input type="date" class="form-control" id="dateEnd">
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary">Thêm</button>
          <button type="reset" class="btn btn-secondary">Hủy</button>
        </div>
      </form><!-- Vertical Form -->

    </div>
  </div>
</main><!-- End #main -->

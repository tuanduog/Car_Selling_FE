  <style>
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #4CAF50;
      color: #fff;
      padding: 12px 18px;
      border-radius: 6px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      opacity: 0;
      transform: translateY(-20px);
      transition: all .4s ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.error {
      background: #f44336;
    }
    
    #pagination {
        display: flex;
        gap: 4px;
        justify-content: center;
        align-items: center;
    }

    .pagination-btn {
        min-width: 32px;
        height: 32px;
        padding: 0 6px;
        font-size: 13px;
        border: 1px solid #dee2e6;
        background: #fff;
        color: #0d6efd;
        border-radius: 4px;
        cursor: pointer;
    }

    .pagination-btn i {
        font-size: 14px;
    }

    .pagination-btn:hover:not(:disabled) {
        background: #e9ecef;
    }

    #pagination button.active {
      font-weight: bold;
      background: #0d6efd;
      color: #fff;
    }

    .pagination-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    /* ===============================
        SIDEBAR RIGHT OVERLAY
    ================================ */

    .sidebar {
    position: fixed !important;
    top: 80px;
    right: -300px;
    left: auto !important;
    bottom: 0;
    width: 300px;
    z-index: 1050;
    transition: all 0.3s ease;
    }

    .toggle-sidebar .sidebar {
    right: 0;
    }

    #main,
    #footer {
    margin-left: 0 !important;
    margin-right: 0 !important;
    }

    @media (min-width: 1200px) {
    #main,
    #footer,
    .toggle-sidebar #main,
    .toggle-sidebar #footer {
        margin-left: 0 !important;
        margin-right: 0 !important;
    }
    }

    #header {
    height: 80px;
    }

    #header .header-nav,
    #header .logo,
    #header .nav-profile {
    height: 80px;
    display: flex;
    align-items: center;
    }
    #main {
    padding-top: 30px;
    }
    .menu-bar {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
    }
    .menu-bar ul {
        list-style-type: none;
    }
    .menu-bar li a {
        display: block;
        font-weight: 600;
        color: #0d6efd;
        cursor: pointer;
        text-decoration: none;
    }
    .menu-bar li:hover {
        color: #0d6efd;
    }

    .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    min-width: 250px;
    max-width: 350px;
    padding: 14px 20px;
    border-radius: 12px;
    color: #fff;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    opacity: 0;
    transform: translateY(-30px) scale(0.95);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 9999;
    pointer-events: none;
}

.toast.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}

.toast.success { background: #4CAF50; }
.toast.error { background: #f44336; }
.toast.info { background: #2196F3; }
.toast.warning { background: #FF9800; }

.toast span { flex: 1; }

.toast::before {
    content: '';
    display: inline-block;
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
}

.toast.success::before {
    background-image: url('data:image/svg+xml;utf8,<svg fill="%23fff" viewBox="0 0 24 24"><path d="M20.285 6.708l-11.39 11.39-5.18-5.18 1.414-1.414 3.766 3.766 9.976-9.976z"/></svg>');
}

.toast.error::before {
    background-image: url('data:image/svg+xml;utf8,<svg fill="%23fff" viewBox="0 0 24 24"><path d="M18.364 5.636l-1.414-1.414L12 9.172 7.05 4.222 5.636 5.636 10.586 10.586 5.636 15.536l1.414 1.414L12 12.828l4.95 4.95 1.414-1.414-4.95-4.95 4.95-4.95z"/></svg>');
}

.toast.info::before {
    background-image: url('data:image/svg+xml;utf8,<svg fill="%23fff" viewBox="0 0 24 24"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>');
}

    
    #pagination {

        gap: 4px;
        justify-content: center;
        align-items: center;
    }

    .pagination-btn {
        min-width: 32px;
        height: 32px;
        padding: 0 6px;
        font-size: 13px;
        border: 1px solid #dee2e6;
        background: #fff;
        color: #0d6efd;
        border-radius: 4px;
        cursor: pointer;
    }

    .pagination-btn i {

    }

    .pagination-btn:hover:not(:disabled) {

    }

    #pagination button.active {

      background: #0d6efd;
      color: #fff;
    }

    .pagination-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

<body>
  <header>

  </header>
  <main id="main" class="main">
    <div class="pagetitle">
      <h1>Quản lý trưởng nhóm</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
          <li class="breadcrumb-item active">Quản lý trưởng nhóm</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->

    <section class="section">
      <div class="row">
        <div class="col-lg-12">

          <div class="card">
            <div class="card-body">

              <!-- Header: tiêu đề + nút thêm -->
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="card-title mb-0">Danh sách trưởng nhóm</h5>
                <button class="btn btn-primary btn-sm" onclick="loadPage('section/leader/add.html')">
                  <i class="bi bi-person-plus"></i> Thêm trưởng nhóm
                </button>
              </div>

              <!-- Bộ lọc + Search -->
              <div class="d-flex align-items-center gap-3 mb-3 flex-nowrap">

                <!-- Select Trạng thái -->
                <div class="col-auto">
                  <span>Trạng thái:</span>
                  <select name="leaderStatus" id="leaderStatus">
                    <option value="">Tất cả</option>
                    <option value="active">Hoạt động</option>
                    <option value="inactive">Ngưng hoạt động</option>
                  </select>
                </div>

                <!-- Ô Search -->
                <div class="col-auto ms-auto">
                  <div class="input-group input-group-sm">
                    <input type="text" class="form-control" name="query" placeholder="Tìm kiếm ..." id="searchLeader">
                    <span class="input-group-text bg-white">
                      <i class="bi bi-search"></i>
                    </span>
                  </div>
                </div>
              </div>

              <!-- Bảng dữ liệu -->
              <table class="table table-striped table-hover datatable align-middle" id="leader-table">
                <thead class="table-light">
                  <tr>
                    <th>Mã nhân viên</th>
                    <th>Họ và tên</th>
                    <th>Email</th>
                    <th>Số điện thoại</th>
                    <th>Trạng thái</th>
                    <th class="text-center">Hành động</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- render -->
                </tbody>
              </table>
              <!-- End Table -->

              <div id="pagination" class="mt-2 d-flex justify-content-end"></div>
            </div>
          </div>

        </div>
      </div>
    </section>

    <script type="text/javascript" src="script.js" defer></script>
  </main><!-- End #main -->
</body>

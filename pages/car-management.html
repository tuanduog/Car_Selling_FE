
<main id="main" class="main">
    <div class="pagetitle">
        <h1>Quản lý xe</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
                <li class="breadcrumb-item active">Quản lý xe</li>
            </ol>
        </nav>
    </div><!-- End Page Title -->

    <section class="section">
        <div class="row">
            <div class="col-lg-12">

                <div class="card">
                    <div class="card-body">

                        <!-- Header: tiêu đề + nút thêm -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">Danh sách xe</h5>
                            <button class="btn btn-primary btn-sm" onclick="loadPage('section/car/add-car.html')">
                                <i class="bi bi-plus"></i> Thêm xe
                            </button>
                        </div>

                        <!-- Bộ lọc + Search -->
                        <div class="d-flex align-items-center gap-3 mb-3 flex-nowrap">

                            <!-- Select Dòng xe -->
                            <div class="col-auto">
                                <span>Trạng thái:</span>
                                <select name="vehicleModel" id="vehicleModel">
                                    <option value="all">Tất cả</option>
                                    <option value="1">Đang bán</option>
                                    <option value="0">Tạm dừng bán</option>
                                </select>
                            </div>

                            <!-- Ô Search -->
                            <div class="col-auto ms-auto">
                                <div class="input-group input-group-sm">
                                    <input type="text" class="form-control" name="query" placeholder="Tìm kiếm ...">
                                    <span class="input-group-text bg-white">
                                        <i class="bi bi-search"></i>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Bảng dữ liệu -->
                        <table class="table table-striped table-hover datatable align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Mã xe</th>
                                    <th>Tên xe</th>
                                    <th>Phiên bản</th>
                                    <th>Giá niêm yết</th>
                                    <th data-type="date" data-format="YYYY/DD/MM">Ngày ra mắt</th>
                                    <th class="text-center">Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>VinFast VF 3</td>
                                    <td>299 triệu VNĐ</td>
                                    <td>321.337.000 VNĐ</td>
                                    <td>321.337.000 VNĐ</td>
                                    <td>2024/05/07</td>
                                    <td class="text-center">
                                        <button class="btn btn-outline-primary btn-sm me-2" title="Chỉnh sửa"
                                            onclick="loadPage('section/car/edit.html')">
                                            <i class="bi bi-pencil-square"></i>
                                        </button>
                                        <button class="btn btn-outline-danger btn-sm" title="Xóa">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <!-- End Table -->

                    </div>
                </div>

            </div>
        </div>
    </section>

    <script type="text/javascript" src="script.js" defer></script>
</main><!-- End #main -->

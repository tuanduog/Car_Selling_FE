<main id="main" class="main">

    <div class="pagetitle">
        <h1>Danh sách đơn hàng chờ xét duyệt</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
                <li class="breadcrumb-item active">Chờ xét duyệt</li>
            </ol>
        </nav>
    </div><!-- End Page Title -->

    <section class="section">
        <div class="row">
            <div class="col-lg-12">

                <div class="card">
                    <div class="card-body">

                        <!-- Header: tiêu đề + nút thêm -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">Danh sách đơn hàng chờ xét duyệt</h5>
                        </div>

                        <!-- Bộ lọc + Search -->
                        <div class="d-flex align-items-center gap-3 mb-3 flex-nowrap">

                            <!-- Select trạng thái -->
                            <div class="col-auto">
                            <span>Hình thức:</span>
                            <select name="paymentStatus" id="paymentStatus">
                                <option value="all">Tất cả</option>
                                <option value="inactive">Chưa hoàn thành</option>
                                <option value="active">Đã hoàn thành</option>
                                <option value="banned">Đã hủy</option>
                            </select>
                            </div>

                            <!-- Ô Search -->
                            <div class="col-auto ms-auto">
                                <div class="input-group input-group-sm">
                                    <input type="text" class="form-control" name="query" placeholder="Tìm kiếm ..." id="pendingSearch">
                                    <span class="input-group-text bg-white">
                                        <i class="bi bi-search"></i>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Bảng dữ liệu -->
                        <table class="table table-striped table-hover datatable align-middle" id="pending-payment-table">
                            <thead class="table-light">
                                <tr>
                                    <th>Mã đơn hàng</th>
                                    <th>Khách hàng</th>
                                    <th>Xe</th>
                                    <th>Số tiền</th>
                                    <th>Hình thức</th>
                                    <th data-type="date" data-format="YYYY/DD/MM">Ngày mua</th>
                                    <th>Trạng thái</th>
                                    <th class="text-center">Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- render data -->
                            </tbody>
                        </table>
                        <!-- End Table -->

                        <div id="pagination" class="mt-2 d-flex justify-content-end"></div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script type="text/javascript" src="script.js" defer></script>
</main><!-- End #main -->

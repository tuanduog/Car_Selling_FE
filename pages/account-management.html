<main id="main" class="main">
  <div class="pagetitle">
    <h1>Quản lý tài khoản</h1>
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
        <li class="breadcrumb-item active">Quản lý tài khoản</li>
      </ol>
    </nav>
  </div><!-- End Page Title -->

  <section class="section">
    <div class="row">
      <div class="col-lg-12">

        <div class="card">
          <div class="card-body">

            <!-- Header: tiêu đề + nút thêm -->
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="card-title mb-0">Danh sách tài khoản</h5>
            </div>

            <!-- Bộ lọc + Search -->
            <div class="d-flex align-items-center gap-3 mb-3 flex-nowrap">

              <!-- Select Vai trò -->
              <div class="col-auto me-3"> <!-- Thêm khoảng cách -->
                <span>Vai trò:</span>
                <select name="accountRole" id="accountRole">
                  <option value="">Tất cả</option>
                  <option value="TeamLeader">Trưởng nhóm</option>
                  <option value="Staff">Nhân viên</option>
                  <option value="Customer">Khách hàng</option>
                </select>
              </div>

              <!-- Select Trạng thái -->
              <div class="col-auto">
                <span>Trạng thái:</span>
                <select name="accountStatus" id="accountStatus">
                  <option value="">Tất cả</option>
                  <option value="active">Hoạt động</option>
                  <option value="banned">Ngừng hoạt động</option>
                </select>
              </div>

              <!-- Ô Search -->
              <div class="col-auto ms-auto">
                <div class="input-group input-group-sm">
                  <input type="text" class="form-control" name="query" placeholder="Tìm kiếm ..." id="searchAccount">
                  <span class="input-group-text bg-white">
                    <i class="bi bi-search"></i>
                  </span>
                </div>
              </div>
            </div>


            <!-- Bảng dữ liệu -->
            <table class="table table-striped table-hover datatable align-middle" id="account-table">
              <thead class="table-light">
                <tr>
                  <th>Họ và tên</th>
                  <th>Email</th>
                  <th>Vai trò</th>
                  <th data-type="date" data-format="YYYY/DD/MM">Ngày tạo</th>
                  <th data-type="date" data-format="YYYY/DD/MM">Ngày cập nhật</th>
                  <th>Trạng thái</th>
                  <th class="text-center">Hành động</th>
                </tr>
              </thead>
              <tbody>
                <!-- Render -->
              </tbody>
            </table>
            <!-- End Table -->
            <div id="pagination" class="mt-2 d-flex justify-content-end"></div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <script type="text/javascript" src="script.js" defer></script>
</main><!-- End #main -->

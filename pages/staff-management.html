<body>
  <header>

  </header>
  <main id="main" class="main">
    <div class="pagetitle">
      <h1>Quản lý nhân viên</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
          <li class="breadcrumb-item active">Quản lý nhân viên</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->

    <section class="section">
      <div class="row">
        <div class="col-lg-12">

          <div class="card">
            <div class="card-body">

              <!-- Header: tiêu đề + nút thêm -->
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="card-title mb-0">Danh sách nhân viên</h5>
                <button class="btn btn-primary btn-sm" onclick="loadPage('section/staff/add.html')">
                  <i class="bi bi-person-plus"></i> Thêm nhân viên
                </button>
              </div>

              <!-- Bộ lọc + Search -->
              <div class="d-flex align-items-center gap-3 mb-3 flex-nowrap">

                <!-- Select Vai trò -->
                <div class="col-auto me-3"> <!-- Thêm khoảng cách -->
                  <span>Nguời quản lý:</span>
                  <select name="userRole" id="userRole">
                    <option value="all">Tất cả</option>
                    <option value="staff">code + ten</option>
                  </select>
                </div>

                <!-- Select Trạng thái -->
                <div class="col-auto">
                  <span>Trạng thái:</span>
                  <select name="userStatus" id="userStatus">
                    <option value="all">Tất cả</option>
                    <option value="active">Hoạt động</option>
                    <option value="inactive">Ngưng hoạt động</option>
                  </select>
                </div>

                <!-- Ô Search -->
                <div class="col-auto ms-auto">
                  <div class="input-group input-group-sm">
                    <input type="text" class="form-control" name="query" placeholder="Search">
                    <span class="input-group-text bg-white">
                      <i class="bi bi-search"></i>
                    </span>
                  </div>
                </div>
              </div>

              <!-- Bảng dữ liệu -->
              <table class="table table-striped table-hover datatable align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Mã nhân viên</th>
                    <th>Họ và tên</th>
                    <th>Email</th>
                    <th>Ngày sinh</th>
                    <th>Người quản lý</th>
                    <th>Trạng thái</th>
                    <th class="text-center">Hành động</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>Dương Anh Tuấn</td>
                    <td>tuanda17@gmail.com</td>
                    <td>Quản trị viên</td>
                    <td>2025/10/01</td>
                    <td>manager1</td>
                    <td><span class="badge bg-success">Hoạt động</span></td>
                    <td class="text-center">
                      <button class="btn btn-outline-primary btn-sm me-2" title="Chỉnh sửa"
                        onclick="loadPage('section/car/edit.html')">
                        <i class="bi bi-pencil-square"></i>
                      </button>
                      <button class="btn btn-outline-danger btn-sm" title="Xóa">
                        <i class="bi bi-trash"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
              <!-- End Table -->

              <div id="pagination" class="mt-2 d-flex justify-content-end"></div>
            </div>
          </div>

        </div>
      </div>
    </section>

    <script type="text/javascript" src="script.js" defer></script>
  </main><!-- End #main -->
</body>
